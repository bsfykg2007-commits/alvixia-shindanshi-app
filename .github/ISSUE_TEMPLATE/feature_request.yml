name: 機能追加提案
description: 新しい学習機能やサイト機能を提案する
title: "機能追加: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。実装方針の相談はDiscussionも活用してください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 何に困っているか、どの利用場面で必要かを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 追加したい機能や期待する動作を書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に考えられる方法があれば書いてください。
    validations:
      required: false
