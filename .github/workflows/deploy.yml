name: Deploy ALVIXIA to Xserver

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Xserver
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.XSERVER_HOST }}
          username: ${{ secrets.XSERVER_USER }}
          password: ${{ secrets.XSERVER_PASSWORD }}
          port: ${{ secrets.XSERVER_PORT }}
          local_path: './'
          remote_path: ${{ secrets.XSERVER_REMOTE_PATH }}
          sftp_only: true
          delete_remote_files: false
          exclude: |
            .git*
            .github/**
            README*
            blog/**
            wp-admin/**
            wp-content/**
            wp-includes/**