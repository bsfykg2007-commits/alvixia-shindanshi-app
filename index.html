<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alvixia 中小企業診断士 一次試験 過去問演習</title><link rel="stylesheet" href="css/style.css"></head><body><header class="hero"><div class="wrap"><p class="brand">Alvixia</p><h1>中小企業診断士 一次試験 過去問演習</h1><p>アップロード済みPDFからJSON化した図表除外版です。</p></div></header><main class="wrap"><section id="setup" class="card"><h2>演習設定</h2><div class="grid"><label>年度<select id="yearSelect"></select></label><label>科目<select id="subjectSelect"></select></label><label>採点方式<select id="modeSelect"><option value="instant">1問ごとに答え合わせ</option><option value="batch">全問回答後に一括採点</option></select></label></div><button id="startBtn" class="primary">開始する</button><p class="note">図表依存問題は除外しています。正答未投入の年度は採点対象外として表示されます。</p></section><section id="quiz" class="card hidden"><div class="progress"><span id="progressText"></span><span id="scoreText"></span></div><h2 id="qTitle"></h2><p id="qStatus" class="note"></p><pre id="qText"></pre><form id="choices"></form><div class="actions"><button id="prevBtn" type="button" class="secondary hidden">前の問題</button><button id="answerBtn" type="button" class="primary">回答する</button><button id="nextBtn" type="button" class="secondary hidden">次の問題</button><button id="finishBtn" type="button" class="primary hidden">結果を見る</button><button id="backBtn" type="button" class="secondary">設定に戻る</button></div><div id="feedback" class="feedback hidden"></div></section><section id="result" class="card hidden"><h2>結果</h2><div id="resultSummary"></div><div id="resultDetails"></div><button id="retryBtn" type="button" class="primary">もう一度解く</button></section></main><script src="js/app.js"></script></body></html>
